<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Template Undangan Pernikahan Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hero">
  <h1>Undangan pernikahan digital, siap dibagikan lewat tautan</h1>
  <p>Pilih satu dari lima template, isi data mempelai, lalu kirim tautannya lewat WhatsApp.</p>
  <a class="btn" href="#editor">Isi data undangan</a>
</header>

<main>
  <section aria-labelledby="h-katalog">
    <h2 id="h-katalog">Pilih template</h2>
    <div class="grid" id="grid"></div>
  </section>

  <section id="editor" class="editor" aria-labelledby="h-editor">
    <form id="form">
      <h2 id="h-editor">Data undangan</h2>
      <label>Template <select id="t" name="t"></select></label>
      <label>Nama mempelai pria <input name="pria" placeholder="Raka"></label>
      <label>Nama mempelai wanita <input name="wanita" placeholder="Sinta"></label>
      <label>Tanggal &amp; jam akad <input name="tanggal" type="datetime-local"></label>
      <label>Nama tempat <input name="tempat" placeholder="Gedung Serbaguna"></label>
      <label>Alamat <input name="alamat" placeholder="Jl. Pemuda No. 1, Semarang"></label>
      <label>Tautan Google Maps <input name="maps" type="url" placeholder="https://maps.app.goo.gl/..."></label>
      <label>Nomor WhatsApp untuk RSVP <input name="wa" inputmode="numeric" placeholder="6281234567890"></label>
      <label>Nama tamu (opsional) <input name="to" placeholder="Bapak/Ibu/Saudara/i"></label>
      <div class="out">
        <input id="link" readonly aria-label="Tautan undangan">
        <button type="button" class="btn" id="copy">Salin tautan</button>
        <a class="btn ghost" id="open" target="_blank" rel="noopener">Buka</a>
      </div>
    </form>
    <div class="phone"><iframe id="live" title="Pratinjau undangan"></iframe></div>
  </section>
</main>
<footer>Dibuat dengan HTML, CSS, dan JavaScript biasa. Tanpa server.</footer>

<script src="js/data.js"></script>
<script src="js/katalog.js"></script>
</body>
</html>
