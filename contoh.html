<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contoh Semua Template Undangan</title>
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f4f1ec;color:#222}header{padding:2rem 1rem;text-align:center}h1{margin:0 0 .3rem}.chips{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:1rem}.chips button{border:1px solid #bbb;background:#fff;border-radius:99px;padding:.4rem .9rem;cursor:pointer;font:inherit}.chips .on{background:#222;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;padding:1rem;max-width:1300px;margin:auto}figure{margin:0;text-align:center}iframe{width:100%;height:560px;border:8px solid #222;border-radius:28px;background:#fff}figcaption b{display:block}a{color:#a33}</style></head><body>
<header><h1>Contoh semua template</h1><p>Setiap template sudah terisi lengkap: foto sampul, galeri, musik, kisah, tiket QR, dan lainnya.</p><div class="chips" id="c"></div></header><div class="grid" id="g"></div>
<script src="data.js"></script><script>
const g=document.getElementById('g'),c=document.getElementById('c');
const show=f=>{g.innerHTML=TEMPLATES.filter(t=>f=='semua'||t.tag.includes(f)).map(t=>`<figure><iframe loading="lazy" src="undangan.html?t=${t.id}" title="${t.nama}"></iframe><figcaption><b>${t.nama}</b>${t.desc}<br><a href="undangan.html?t=${t.id}" target="_blank">Buka layar penuh</a></figcaption></figure>`).join('');[...c.children].forEach(b=>b.classList.toggle('on',b.dataset.f==f))};
c.innerHTML=Object.entries(FILTER).map(([k,v])=>`<button data-f="${k}">${v}</button>`).join('');c.onclick=e=>e.target.dataset.f&&show(e.target.dataset.f);show('semua');
</script></body></html>
