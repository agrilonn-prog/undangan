<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undangan Pernikahan</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Playfair+Display:wght@500;700&family=Poppins:wght@400;600;800&family=Cinzel:wght@500;700&family=Amiri:wght@400;700&family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema-undangan.css">
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="data.js"></script>
<script src="bisnis.js"></script>
<script>
// Mode bisnis: undangan ?id=KODE memuat datanya dari Google Sheet (status pesanan ikut diperiksa)
(function () {
  var q = new URLSearchParams(location.search), id = q.get('id'), B = window.BISNIS || {};
  var go = function () { var s = document.createElement('script'); s.src = 'render-undangan.js'; document.body.appendChild(s); };
  var pesan = function (t) { document.getElementById('app').innerHTML = '<p style="font:600 1rem sans-serif;text-align:center;padding:4rem 1.5rem">' + t + '</p>'; };
  window.PESANAN = null;
  if (B.aktif && id && B.api) {
    fetch(B.api + '?pesanan=' + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.ok) return pesan('Undangan tidak ditemukan. Periksa kembali tautannya.');
      window.PESANAN = j; go();
    }).catch(function () { pesan('Undangan belum bisa dimuat. Periksa koneksi lalu muat ulang halaman.'); });
  } else go();
})();
</script>
</body>
</html>
